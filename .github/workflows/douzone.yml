name: Generate Douzone Digest (OpenAI)

# 더존비즈온 다이제스트 — Naver 수집 → URL검증 → dedup → OpenAI(카테고리분류+작성) →
# 렌더 → verify_links → ADMIN_PAT push. (Anthropic 루틴 대체)
# ⚠️ 파일럿 중 cron 비활성. 검증되면 schedule 주석 해제 + 옛 더존 루틴 폐기.

on:
  # schedule:
  #   - cron: "0 19 * * *"      # 04:00 KST
  workflow_dispatch:

concurrency:
  group: douzone-generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.ADMIN_PAT }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet openai
      - name: Generate
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
        run: python scripts/douzone/generate.py
      - name: Citation-link gate
        run: |
          TODAY=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          python .github/scripts/verify_links.py "douzone/archive/${TODAY}.html" douzone/index.html
      - name: Commit & push
        run: |
          set -o pipefail
          TODAY=$(TZ='Asia/Seoul' date +%Y-%m-%d)
          git config user.name "Douzone Digest Bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then echo "❌ NO_CHANGES"; exit 1; fi
          git commit -m "Daily Douzone digest: ${TODAY}"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "✅ PUSH_OK ($i)"; exit 0; fi
            git fetch origin main && git rebase origin/main || git rebase --abort || true
            sleep 4
          done
          echo "❌ PUSH_FAILED"; exit 1
