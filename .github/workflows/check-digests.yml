name: Check Digest Freshness

on:
  schedule:
    - cron: '50 22 * * *'  # 07:50 KST (= 22:50 UTC) — 경쟁사 07:00 생성·notify 직후 점검
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check all digest manifests for today's entry
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GMAIL_EXTRA_RECIPIENTS: ${{ secrets.GMAIL_EXTRA_RECIPIENTS }}
        run: python3 .github/scripts/check_digests.py
